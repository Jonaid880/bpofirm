# Australian business directories for citation building.
# Each entry: name, submit_url (or homepage), search_url (with {q} placeholder
# to test existence), priority (1=must-have, 2=should-have, 3=nice-to-have),
# free_to_list (bool), category.
#
# Edit freely. Bot uses search_url to check if you're already listed.

directories:
  - {name: "Google Business Profile",     submit_url: "https://business.google.com/create",      search_url: "https://www.google.com/search?q={q}+site:google.com/maps",          priority: 1, free: true,  category: search}
  - {name: "Bing Places for Business",    submit_url: "https://www.bingplaces.com/",             search_url: "https://www.bing.com/search?q={q}+site:bing.com/maps",             priority: 1, free: true,  category: search}
  - {name: "Apple Business Connect",      submit_url: "https://businessconnect.apple.com/",      search_url: "https://duckduckgo.com/?q={q}+site:maps.apple.com",                priority: 1, free: true,  category: search}
  - {name: "True Local",                  submit_url: "https://www.truelocal.com.au/add-business", search_url: "https://www.truelocal.com.au/search/{q}",                         priority: 1, free: true,  category: au_directory}
  - {name: "Yellow Pages Australia",      submit_url: "https://www.yellowpages.com.au/add-business", search_url: "https://www.yellowpages.com.au/search/listings?clue={q}",       priority: 1, free: true,  category: au_directory}
  - {name: "White Pages Australia",       submit_url: "https://www.whitepages.com.au/add-business", search_url: "https://www.whitepages.com.au/search?searchTerm={q}",            priority: 1, free: true,  category: au_directory}
  - {name: "Hotfrog Australia",           submit_url: "https://www.hotfrog.com.au/AddCompany",   search_url: "https://www.hotfrog.com.au/search?query={q}",                      priority: 2, free: true,  category: au_directory}
  - {name: "StartLocal",                  submit_url: "https://www.startlocal.com.au/business-search/", search_url: "https://www.startlocal.com.au/search?q={q}",                priority: 2, free: true,  category: au_directory}
  - {name: "Local Search",                submit_url: "https://www.localsearch.com.au/list-business", search_url: "https://www.localsearch.com.au/search?q={q}",                  priority: 2, free: true,  category: au_directory}
  - {name: "Yelp Australia",              submit_url: "https://biz.yelp.com.au/",                search_url: "https://www.yelp.com.au/search?find_desc={q}",                     priority: 2, free: true,  category: review}
  - {name: "ProductReview.com.au",        submit_url: "https://www.productreview.com.au/businesses", search_url: "https://www.productreview.com.au/search?q={q}",               priority: 1, free: true,  category: review}
  - {name: "Trustpilot",                  submit_url: "https://business.trustpilot.com/",        search_url: "https://www.trustpilot.com/search?query={q}",                      priority: 2, free: true,  category: review}
  - {name: "Word of Mouth Online",        submit_url: "https://www.womo.com.au/add-business",    search_url: "https://www.womo.com.au/search?q={q}",                             priority: 3, free: true,  category: au_directory}
  - {name: "Aussie Web",                  submit_url: "https://www.aussieweb.com.au/Suggest/",   search_url: "https://www.aussieweb.com.au/search?keywords={q}",                 priority: 3, free: true,  category: au_directory}
  - {name: "Business.gov.au",             submit_url: "https://business.gov.au/",                search_url: "https://duckduckgo.com/?q={q}+site:business.gov.au",               priority: 2, free: true,  category: government}
  - {name: "ABN Lookup",                  submit_url: "https://abr.business.gov.au/",            search_url: "https://abr.business.gov.au/Search/ResultsActive?SearchText={q}",  priority: 1, free: true,  category: government}
  - {name: "ASIAL Member Directory",      submit_url: "https://www.asial.com.au/member-services/become-a-member", search_url: "https://www.asial.com.au/find-a-security-provider?keywords={q}", priority: 1, free: false, category: industry}
  - {name: "Master Locksmiths Association", submit_url: "https://www.masterlocksmiths.com.au/",  search_url: "https://www.masterlocksmiths.com.au/find-a-locksmith?q={q}",       priority: 3, free: false, category: industry}
  - {name: "Security Electronics Network", submit_url: "https://www.sen.news/",                  search_url: "https://duckduckgo.com/?q={q}+site:sen.news",                      priority: 3, free: true,  category: industry}
  - {name: "Australian Security Magazine", submit_url: "https://australiansecuritymagazine.com.au/", search_url: "https://duckduckgo.com/?q={q}+site:australiansecuritymagazine.com.au", priority: 3, free: true, category: industry}
  - {name: "LinkedIn Company Page",       submit_url: "https://www.linkedin.com/company/setup/new/", search_url: "https://www.linkedin.com/search/results/companies/?keywords={q}", priority: 1, free: true,  category: social}
  - {name: "Facebook Business Page",      submit_url: "https://www.facebook.com/pages/creation/", search_url: "https://www.facebook.com/search/pages/?q={q}",                    priority: 1, free: true,  category: social}
  - {name: "Crunchbase",                  submit_url: "https://www.crunchbase.com/add-new",      search_url: "https://www.crunchbase.com/textsearch?q={q}",                      priority: 2, free: true,  category: business}
  - {name: "Glassdoor Australia",         submit_url: "https://www.glassdoor.com.au/employers/",  search_url: "https://www.glassdoor.com.au/Reviews/company-reviews.htm?suggestCount=10&suggestChosen=false&clickSource=searchBtn&typedKeyword={q}", priority: 3, free: true, category: review}
  - {name: "FourSquare",                  submit_url: "https://foursquare.com/business/",        search_url: "https://foursquare.com/explore?mode=url&near=Sydney&q={q}",         priority: 3, free: true,  category: international}
  - {name: "OpenStreetMap",               submit_url: "https://www.openstreetmap.org/user/new",  search_url: "https://nominatim.openstreetmap.org/search?q={q}&countrycodes=au",  priority: 2, free: true,  category: maps}
