<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>BPO Firm — Cinematic hero (octaboot.lb-inspired)</title>
	<link rel="stylesheet" href="../wp-content/plugins/bpofirm-design-system/assets/tokens.css">
	<link rel="stylesheet" href="../wp-content/plugins/bpofirm-cinematic-hero/assets/cinematic-hero.css">
	<style>
		/* Preview-only resets so the section fills the visible page. */
		body { margin: 0; padding: 0; font-family: var(--bpo-font-body); background: #000; color: #fff; }
	</style>
</head>
<body class="bpo-page">
	<section class="bpo-cine">
		<div class="bpo-cine__bg bpo-cine__bg--exterior"></div>
		<div class="bpo-cine__bg bpo-cine__bg--interior"></div>
		<div class="bpo-cine__vignette" aria-hidden="true"></div>

		<div class="bpo-cine__stage" aria-hidden="true">
			<div class="bpo-cine__keypad">
				<div class="bpo-cine__display">
					<span class="digit">1</span>
					<span class="digit">3</span>
					<span class="digit">0</span>
					<span class="digit">0</span>
				</div>
				<div class="bpo-cine__keys">
					<div class="bpo-cine__key is-active" data-step="1">1</div>
					<div class="bpo-cine__key">2</div>
					<div class="bpo-cine__key is-active" data-step="2">3</div>
					<div class="bpo-cine__key">4</div>
					<div class="bpo-cine__key">5</div>
					<div class="bpo-cine__key">6</div>
					<div class="bpo-cine__key">7</div>
					<div class="bpo-cine__key">8</div>
					<div class="bpo-cine__key">9</div>
					<div class="bpo-cine__key">*</div>
					<div class="bpo-cine__key is-active" data-step="3">0</div>
					<div class="bpo-cine__key is-active" data-step="4">0</div>
				</div>
			</div>
			<div class="bpo-cine__granted">Access Granted</div>
		</div>

		<div class="bpo-cine__content">
			<p class="bpo-cine__eyebrow">A partnership unlocked</p>
			<h1 class="bpo-cine__title">Welcome inside <em>BPO Firm</em>.</h1>
			<p class="bpo-cine__lede">
				Calls. Chats. Social. AI assists. Every channel — orchestrated under one roof.
				Plug your stack in once; ship outcomes from day one.
			</p>
			<div class="bpo-cine__ctas">
				<a href="#" class="bpo-cine__btn bpo-cine__btn--solid">Book a discovery call</a>
				<a href="#" class="bpo-cine__btn bpo-cine__btn--outline">See our work</a>
			</div>
		</div>
	</section>
</body>
</html>
