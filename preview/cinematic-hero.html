<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>BPO Firm — Cinematic hero (octaboot.lb-inspired)</title>
	<link rel="stylesheet" href="../wp-content/plugins/bpofirm-design-system/assets/tokens.css">
	<style>
		body { margin: 0; padding: 0; font-family: var(--bpo-font-body); background: #000; color: #fff; }

		/* The cinematic hero. Choreographed entirely with CSS keyframes so
		 * it loops cleanly with no JS state. Total cycle: 9s. */
		.bpo-cine {
			position: relative;
			width: 100%;
			height: 100vh;
			overflow: hidden;
			isolation: isolate;
		}

		/* --- Background plates (exterior then interior) --- */
		.bpo-cine__bg {
			position: absolute; inset: 0;
			background-size: cover;
			background-position: center;
			will-change: opacity, transform;
		}
		.bpo-cine__bg--exterior {
			z-index: 1;
			background-image: var(--bpo-cine-exterior,
				radial-gradient(ellipse at 50% 35%, #2a1810 0%, #0a0604 60%, #000 100%));
			animation:
				bpo-cine-exterior-show 9s ease-in-out infinite,
				bpo-cine-kb-exterior   9s ease-in-out infinite;
		}
		.bpo-cine__bg--interior {
			z-index: 2;
			background-image: var(--bpo-cine-interior,
				radial-gradient(ellipse at 35% 40%, #d4a574 0%, #6b4423 30%, #2a1a0d 70%, #000 100%));
			opacity: 0;
			animation:
				bpo-cine-interior-show 9s ease-in-out infinite,
				bpo-cine-kb-interior   9s ease-in-out infinite;
		}
		@keyframes bpo-cine-exterior-show {
			0%, 45% { opacity: 1; }
			55%, 100% { opacity: 0; }
		}
		@keyframes bpo-cine-interior-show {
			0%, 45% { opacity: 0; }
			55%, 100% { opacity: 1; }
		}
		@keyframes bpo-cine-kb-exterior {
			0% { transform: scale(1.0)  translate(0, 0); }
			55% { transform: scale(1.08) translate(-1%, -0.5%); }
			100% { transform: scale(1.08) translate(-1%, -0.5%); }
		}
		@keyframes bpo-cine-kb-interior {
			0%, 55% { transform: scale(1.0)  translate(0, 0); }
			100% { transform: scale(1.10) translate(1%, 0); }
		}

		/* --- Warm cinematic vignette (always on) --- */
		.bpo-cine__vignette {
			position: absolute; inset: 0; z-index: 3;
			pointer-events: none;
			background:
				radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.85) 100%),
				radial-gradient(ellipse at 30% 20%, rgba(255, 195, 100, 0.18) 0%, transparent 50%),
				radial-gradient(ellipse at 70% 80%, rgba(255, 165, 80, 0.10) 0%, transparent 60%);
		}

		/* --- Keypad stage (visible 0-4s, fades 4-5s) --- */
		.bpo-cine__stage {
			position: absolute; inset: 0; z-index: 4;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			gap: 28px;
			animation: bpo-cine-stage 9s ease-in-out infinite;
		}
		@keyframes bpo-cine-stage {
			0%   { opacity: 0; transform: translateY(8px); }
			6%   { opacity: 1; transform: translateY(0); }
			44%  { opacity: 1; }
			55%  { opacity: 0; transform: translateY(-8px); }
			100% { opacity: 0; transform: translateY(-8px); }
		}

		/* --- Keypad device --- */
		.bpo-cine__keypad {
			width: 220px;
			padding: 24px 22px 18px;
			background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
			border: 1px solid rgba(255, 215, 130, 0.25);
			border-radius: 24px;
			box-shadow:
				0 30px 80px rgba(0,0,0,0.6),
				inset 0 1px 0 rgba(255, 215, 130, 0.12);
		}
		.bpo-cine__display {
			display: flex; justify-content: center; gap: 10px;
			margin-bottom: 18px;
			font-family: ui-monospace, monospace;
			font-size: 22px; font-weight: 600;
			letter-spacing: 0.18em;
			color: rgba(255, 215, 130, 0.85);
			height: 28px;
		}
		.bpo-cine__display .digit {
			display: inline-block; width: 14px; text-align: center;
			color: rgba(255, 215, 130, 0.25);
			animation: bpo-cine-digit 9s linear infinite;
		}
		.bpo-cine__display .digit:nth-child(1) { animation-delay: 0.8s; }
		.bpo-cine__display .digit:nth-child(2) { animation-delay: 1.4s; }
		.bpo-cine__display .digit:nth-child(3) { animation-delay: 2.0s; }
		.bpo-cine__display .digit:nth-child(4) { animation-delay: 2.6s; }
		@keyframes bpo-cine-digit {
			0%,  8% { color: rgba(255, 215, 130, 0.25); content: '·'; }
			9%, 100% { color: rgba(255, 215, 130, 0.95); }
		}

		.bpo-cine__keys {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 8px;
		}
		.bpo-cine__key {
			aspect-ratio: 1;
			display: flex; align-items: center; justify-content: center;
			background: rgba(255, 255, 255, 0.04);
			border: 1px solid rgba(255, 215, 130, 0.12);
			border-radius: 10px;
			font-family: var(--bpo-font-body);
			font-size: 18px; font-weight: 500;
			color: rgba(255, 215, 130, 0.6);
			transition: background 0.15s ease;
		}
		.bpo-cine__key.is-active {
			animation: bpo-cine-key-press 9s ease-in-out infinite;
		}
		@keyframes bpo-cine-key-press {
			0%, 8% { background: rgba(255, 255, 255, 0.04); box-shadow: none; color: rgba(255, 215, 130, 0.6); }
			9%, 13% {
				background: rgba(255, 195, 100, 0.4);
				box-shadow: 0 0 18px rgba(255, 195, 100, 0.7);
				color: #fff;
			}
			14%, 100% { background: rgba(255, 215, 130, 0.10); color: rgba(255, 215, 130, 0.85); }
		}
		/* Stagger the key-press animation per key by overriding animation-delay */
		.bpo-cine__key[data-step="1"] { animation-delay: 0.8s; }
		.bpo-cine__key[data-step="2"] { animation-delay: 1.4s; }
		.bpo-cine__key[data-step="3"] { animation-delay: 2.0s; }
		.bpo-cine__key[data-step="4"] { animation-delay: 2.6s; }

		/* --- "Access Granted" badge --- */
		.bpo-cine__granted {
			padding: 10px 22px;
			border: 1px solid rgba(255, 215, 130, 0.5);
			border-radius: 4px;
			background: rgba(255, 195, 100, 0.08);
			font-family: ui-monospace, 'SF Mono', Menlo, monospace;
			font-weight: 700;
			font-size: 18px;
			letter-spacing: 0.32em;
			color: #ffd770;
			text-transform: uppercase;
			text-shadow:
				0 0 12px rgba(255, 195, 100, 0.9),
				0 0 32px rgba(255, 195, 100, 0.5);
			box-shadow:
				0 0 28px rgba(255, 195, 100, 0.4),
				inset 0 0 12px rgba(255, 195, 100, 0.15);
			opacity: 0;
			animation: bpo-cine-granted 9s ease-in-out infinite;
		}
		@keyframes bpo-cine-granted {
			0%, 32%  { opacity: 0; transform: scale(0.95); }
			36%, 50% { opacity: 1; transform: scale(1); }
			55%, 100% { opacity: 0; transform: scale(1); }
		}

		/* --- Hero content (revealed after keypad) --- */
		.bpo-cine__content {
			position: absolute; inset: 0; z-index: 5;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			text-align: center;
			padding: 32px;
			pointer-events: none;
			opacity: 0;
			animation: bpo-cine-content 9s ease-in-out infinite;
		}
		.bpo-cine__content > * { pointer-events: auto; }
		@keyframes bpo-cine-content {
			0%, 55% { opacity: 0; transform: translateY(12px); }
			62%, 92% { opacity: 1; transform: translateY(0); }
			100% { opacity: 0; transform: translateY(-8px); }
		}

		.bpo-cine__eyebrow {
			font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase;
			color: rgba(255, 215, 130, 0.85);
			margin: 0 0 24px;
		}
		.bpo-cine__title {
			font-family: var(--bpo-font-display);
			font-style: italic;
			font-size: clamp(48px, 8vw, 96px);
			line-height: 0.95;
			margin: 0 0 20px;
			color: #fff;
			max-width: 16ch;
		}
		.bpo-cine__title em { color: var(--bpo-brand); font-style: italic; }
		.bpo-cine__lede {
			font-size: 16px;
			line-height: 1.6;
			color: rgba(255, 255, 255, 0.82);
			max-width: 34rem;
			margin: 0 0 32px;
		}
		.bpo-cine__ctas { display: inline-flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
		.bpo-cine__btn {
			display: inline-block;
			padding: 14px 28px;
			border-radius: 999px;
			font-size: 14px; font-weight: 500;
			text-decoration: none;
			transition: transform 0.2s ease;
		}
		.bpo-cine__btn:hover { transform: scale(1.05); }
		.bpo-cine__btn--solid {
			background: var(--bpo-brand);
			color: #fff;
			box-shadow: 0 8px 32px rgba(239, 73, 75, 0.4);
		}
		.bpo-cine__btn--outline {
			background: transparent;
			color: #fff;
			box-shadow: inset 0 0 0 1.5px rgba(255, 215, 130, 0.7);
		}

		/* Skip-loop affordance — once the user has seen the keypad moment
		 * we don't keep re-blocking them. After 9s the page can settle into
		 * just the interior + content (no relooping the keypad). This is
		 * the "one-shot intro" mode. Toggle via .bpo-cine--once on the section. */
		.bpo-cine--once .bpo-cine__bg--exterior,
		.bpo-cine--once .bpo-cine__bg--interior,
		.bpo-cine--once .bpo-cine__stage,
		.bpo-cine--once .bpo-cine__content,
		.bpo-cine--once .bpo-cine__key,
		.bpo-cine--once .bpo-cine__display .digit,
		.bpo-cine--once .bpo-cine__granted {
			animation-iteration-count: 1;
			animation-fill-mode: forwards;
		}

		@media (prefers-reduced-motion: reduce) {
			.bpo-cine__bg, .bpo-cine__stage, .bpo-cine__content,
			.bpo-cine__key, .bpo-cine__display .digit, .bpo-cine__granted {
				animation: none !important;
			}
			.bpo-cine__bg--exterior { opacity: 0; }
			.bpo-cine__bg--interior { opacity: 1; }
			.bpo-cine__content { opacity: 1; }
			.bpo-cine__stage { opacity: 0; }
		}
	</style>
</head>
<body class="bpo-page">
	<section class="bpo-cine">
		<div class="bpo-cine__bg bpo-cine__bg--exterior"></div>
		<div class="bpo-cine__bg bpo-cine__bg--interior"></div>
		<div class="bpo-cine__vignette" aria-hidden="true"></div>

		<div class="bpo-cine__stage" aria-hidden="true">
			<div class="bpo-cine__keypad">
				<div class="bpo-cine__display">
					<span class="digit">•</span>
					<span class="digit">•</span>
					<span class="digit">•</span>
					<span class="digit">•</span>
				</div>
				<div class="bpo-cine__keys">
					<div class="bpo-cine__key is-active" data-step="1">1</div>
					<div class="bpo-cine__key">2</div>
					<div class="bpo-cine__key is-active" data-step="2">3</div>
					<div class="bpo-cine__key">4</div>
					<div class="bpo-cine__key">5</div>
					<div class="bpo-cine__key">6</div>
					<div class="bpo-cine__key">7</div>
					<div class="bpo-cine__key">8</div>
					<div class="bpo-cine__key">9</div>
					<div class="bpo-cine__key">*</div>
					<div class="bpo-cine__key is-active" data-step="3">0</div>
					<div class="bpo-cine__key is-active" data-step="4">0</div>
				</div>
			</div>
			<div class="bpo-cine__granted">Access Granted</div>
		</div>

		<div class="bpo-cine__content">
			<p class="bpo-cine__eyebrow">A partnership unlocked</p>
			<h1 class="bpo-cine__title">Welcome inside <em>BPO Firm</em>.</h1>
			<p class="bpo-cine__lede">
				Calls. Chats. Social. AI assists. Every channel — orchestrated under one roof.
				Plug your stack in once; ship outcomes from day one.
			</p>
			<div class="bpo-cine__ctas">
				<a href="#" class="bpo-cine__btn bpo-cine__btn--solid">Book a discovery call</a>
				<a href="#" class="bpo-cine__btn bpo-cine__btn--outline">See our work</a>
			</div>
		</div>
	</section>
</body>
</html>
